# Runs the website, API and database on your web server.
# Usage:  cp server/.env.example server/.env   (fill it in)
#         echo "DOMAIN=yourdomain.com" > .env
#         echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
#         echo "BACKUP_PASSWORD=$(openssl rand -hex 24)" >> .env   (store a copy somewhere safe!)
#         docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jirex
      POSTGRES_USER: jirex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jirex -d jirex']
      interval: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://jirex:${POSTGRES_PASSWORD}@db:5432/jirex
      UPLOAD_DIR: /app/uploads
    volumes:
      - receipts:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Encrypted backup of the database + receipts, once at start and then every 24 hours,
  # into ./backups (kept 14 days). Copy them off the server regularly.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:?set BACKUP_PASSWORD in .env}
      BACKUP_KEEP_DAYS: 14
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - receipts:/receipts
      - ./backups:/backups
    entrypoint: ['sh', '-c', 'apk add --no-cache openssl >/dev/null; while true; do sh /backup.sh || echo "[backup] FAILED"; sleep 86400; done']
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
    depends_on:
      - api

volumes:
  receipts:
  db-data:
  caddy-data:
