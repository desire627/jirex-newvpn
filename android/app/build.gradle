plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'com.jirex.vpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jirex.vpn'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.4.2'
        def serviceUrl = providers.gradleProperty('jirexUrl').orElse('').get()
        buildConfigField 'String', 'JIREX_URL', groovy.json.JsonOutput.toJson(serviceUrl)
    }

    buildFeatures { buildConfig true }
    packaging {
        resources.excludes += 'META-INF/versions/**/OSGI-INF/MANIFEST.MF'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.zaneschepke:amneziawg-android:2.3.7'
}
